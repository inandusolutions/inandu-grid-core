name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The date tests set TZ themselves; this runs the whole suite once more west of UTC, where a bare yyyy-mm-dd used to break.
      - name: Unit tests (America/Bogota)
        run: npm test
        env:
          TZ: America/Bogota

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
