name: Pages

# Publishes site/ (a static page: install, usage, what is inside) to GitHub Pages.
#   https://inandusolutions.github.io/inandu-grid-core/
#
# Pages "Source" must be set to "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/architecture.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp docs/architecture.svg _site/architecture.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
